version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Local Development Stack
# Health Insurance AI Platform
#
# Services:
#   api         — FastAPI fraud detection scoring service
#   db          — PostgreSQL (application database)
#   redis       — Cache / session store
#   airflow     — Pipeline orchestration (webserver + scheduler)
#   mlflow      — Model registry & experiment tracking
#   pgadmin     — PostgreSQL UI (dev only)
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-dev}
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-health_insurance_ai}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-localdevpassword}
  HIPAA_MODE: ${HIPAA_MODE:-true}
  ANON_SALT: ${ANON_SALT:-local-dev-salt-change-in-prod}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:

  # ─── FastAPI Scoring Service ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hi-ai-api
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 2
      MODEL_DIR: /app/models/saved
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - hi-ai-network

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: hi-ai-db
    environment:
      POSTGRES_DB:       ${DB_NAME:-health_insurance_ai}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hi-ai-network

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hi-ai-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - hi-ai-network

  # ─── MLflow Model Registry ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: hi-ai-mlflow
    command: >
      mlflow server
        --backend-store-uri postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-localdevpassword}@db:5432/mlflow
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0
        --port 5000
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hi-ai-network

  # ─── PgAdmin (dev only) ────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hi-ai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - dev          # Only starts with: docker compose --profile dev up
    networks:
      - hi-ai-network

volumes:
  postgres_data:
  mlflow_artifacts:

networks:
  hi-ai-network:
    driver: bridge
