[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=20
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may need data/models)
    slow: Slow tests (model training)
    api: FastAPI endpoint tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
