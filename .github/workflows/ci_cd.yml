name: Health Insurance AI — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.10"
  AWS_REGION:     "us-east-1"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: LINT & FORMAT CHECK
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install flake8 black isort

      - name: Run Black (auto-format)
        run: black src/ tests/

      - name: Run isort (auto-format)
        run: isort src/ tests/

      - name: Run flake8 (lint)
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --ignore=E203,W503,E501,W504 \
            --exclude=__pycache__,.venv,venv

  # ─────────────────────────────────────────────────────────────
  # JOB 2: UNIT & INTEGRATION TESTS
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm --quiet

      - name: Generate synthetic data for tests
        run: python src/ingestion/generate_synthetic_data.py

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=20
        env:
          APP_ENV: test
          HIPAA_MODE: "true"
          ANON_SALT: "ci-test-salt-2024"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: MODEL SMOKE TEST
  # ─────────────────────────────────────────────────────────────
  model-smoke:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ML dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost faker pyarrow

      - name: Generate data & run pipeline
        run: |
          python src/ingestion/generate_synthetic_data.py
          PYTHONPATH=. python src/ingestion/pipeline_runner.py --source synthetic --env dev

      - name: Train fraud model (smoke test)
        run: |
          PYTHONPATH=. python src/models/fraud_model.py \
            --data data/processed/features_dev.parquet
        env:
          APP_ENV: test

      - name: Verify model artifacts exist
        run: |
          ls -la models/saved/
          test -n "$(ls models/saved/*.joblib 2>/dev/null)" || exit 1
          echo "Model artifacts verified."

  # ─────────────────────────────────────────────────────────────
  # JOB 4: DOCKER BUILD & SECURITY SCAN
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: model-smoke
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: health-insurance-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: health-insurance-ai:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────
  # JOB 5: DEPLOY TO STAGING (main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push image to ECR
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: health-insurance-ai
          IMAGE_TAG:      ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                      $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:staging-latest

      - name: Deploy to ECS (Staging)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecs update-service \
            --cluster health-insurance-ai-staging \
            --service  fraud-detection-api \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster health-insurance-ai-staging \
            --services fraud-detection-api \
            --region ${{ env.AWS_REGION }}

      - name: Health check staging
        run: |
          STAGING_URL="https://api-staging.health-insurance-ai.internal"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i — status: $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "Health check FAILED after 10 attempts."
          exit 1

  # ─────────────────────────────────────────────────────────────
  # JOB 6: DEPLOY TO PRODUCTION (manual approval required)
  # ─────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production   # Requires manual approval in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote staging image to production
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: health-insurance-ai
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
                      $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:prod-latest

      - name: Blue/Green deploy to ECS Production
        run: |
          aws ecs update-service \
            --cluster health-insurance-ai-prod \
            --service  fraud-detection-api \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Notify Slack on deploy success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Health Insurance AI* deployed to PRODUCTION — commit `${{ github.sha }}` by ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on deploy failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *Health Insurance AI* PRODUCTION deploy FAILED — commit `${{ github.sha }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
