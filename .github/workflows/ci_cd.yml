name: Health Insurance AI — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: "us-east-1"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: LINT & FORMAT CHECK
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install black isort flake8

      - name: Run Black
        run: black src/ tests/

      - name: Run isort
        run: isort src/ tests/

      - name: Run flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --ignore=E203,W503,E501,W504 \
            --exclude=__pycache__,.venv,venv

  # ─────────────────────────────────────────────
  # JOB 2: UNIT TESTS
  # ─────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm --quiet

      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=20
        env:
          APP_ENV: test
          HIPAA_MODE: "true"
          ANON_SALT: "ci-test-salt-2024"

  # ─────────────────────────────────────────────
  # JOB 3: MODEL SMOKE TEST
  # ─────────────────────────────────────────────
  model-smoke:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          PYTHONPATH=. python src/ingestion/generate_synthetic_data.py

      - name: Run data pipeline
        run: |
          PYTHONPATH=. python src/ingestion/pipeline_runner.py \
            --source synthetic --env dev

      - name: Train fraud model
        run: |
          PYTHONPATH=. python src/models/fraud_model.py \
            --data data/processed/features_dev.parquet

      - name: Verify model artifacts
        run: |
          ls -la models/saved/
          test -n "$(ls models/saved/*.joblib 2>/dev/null)" || exit 1
          echo "Model artifacts verified!"